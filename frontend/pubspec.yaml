name: cavedash
description: Frontend app for Cave Dash
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  get_it: ^8.0.3
  flame: ^1.23.0
  logger: ^2.5.0
  dafluta: ^5.4.0
  url_strategy: ^0.3.0
  flame_forge2d: ^0.18.2+4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5

  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  cloud_functions: ^5.2.0
  cloud_firestore: ^5.6.0

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.5.0
  daassets: ^1.5.0
  daunused: ^1.6.1
  dapublock: ^1.1.0
  build_runner: ^2.4.14
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/levels/