name: commandos
description: Frontend app for Commandos
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  get_it: ^8.2.0
  flame: ^1.30.1
  logger: ^2.6.1
  dafluta: ^5.5.1
  just_audio: ^0.10.4
  url_strategy: ^0.3.0
  flame_forge2d: ^0.19.0+4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  firebase_core: ^4.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  xml2json: ^6.2.7
  dalocale: ^2.6.0
  daassets: ^1.5.0
  daunused: ^1.7.4
  dapublock: ^1.1.0
  build_runner: ^2.6.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/icons/
    - assets/images/maps/
