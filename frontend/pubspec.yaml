name: commandos
description: Frontend app for Commandos
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  get_it: ^8.0.3
  flame: ^1.30.1
  logger: ^2.6.0
  dafluta: ^5.5.1
  url_strategy: ^0.3.0
  flame_forge2d: ^0.19.0+4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  firebase_core: ^3.15.1
  firebase_analytics: ^11.5.2
  firebase_crashlytics: ^4.3.9

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  xml2json: ^6.2.7
  dalocale: ^2.6.0
  daassets: ^1.5.0
  daunused: ^1.7.4
  dapublock: ^1.1.0
  build_runner: ^2.6.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/agents/
    - assets/images/levels/
    - assets/images/turrets/
